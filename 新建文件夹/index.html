<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --secondary: #10b981;
            --bg: #ffffff;
            --bg-alt: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
            --shadow-hover: 0 10px 30px rgba(15, 23, 42, 0.12);
            --transition: 200ms ease;
        }
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --secondary: #34d399;
            --bg: #0f172a;
            --bg-alt: #1e293b;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 20px rgba(0,0,0,0.25);
            --shadow-hover: 0 10px 30px rgba(0,0,0,0.35);
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-top: 72px;
            transition: var(--transition);
        }
        .container { max-width: 1100px; margin:0 auto; padding:0 20px; }
        /* Navbar */
        nav {
            position: fixed; top:0; left:0; right:0; z-index: 99;
            background: var(--card); border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .nav-inner { display:flex; align-items:center; justify-content:space-between; height:72px; }
        .nav-brand { font-size:1.3rem; font-weight:700; color:var(--primary); text-decoration:none; }
        .nav-links { display:flex; gap:24px; align-items:center; }
        .nav-links a { color:var(--text); text-decoration:none; font-size:0.92rem; transition:var(--transition); }
        .nav-links a:hover { color:var(--primary); }
        .nav-actions { display:flex; gap:12px; }
        button {
            border:1px solid var(--border); background:var(--card); color:var(--text);
            padding:7px 12px; border-radius:8px; cursor:pointer; font-size:0.9rem;
            transition:var(--transition);
        }
        button:hover { border-color:var(--primary); color:var(--primary); }
        .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-primary:hover { background:var(--primary-light); }
        /* Hero */
        .hero { padding:60px 0; display:grid; grid-template-columns: 1fr auto; gap:32px; align-items:start; }
        @media(max-width:768px){ .hero{ grid-template-columns:1fr; } }
        .hero h1 { font-size:2.4rem; margin-bottom:8px; }
        .hero-sub { color:var(--text-muted); font-size:1.1rem; margin-bottom:20px; }
        .badge-row { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0; }
        .badge {
            padding:4px 10px; border-radius:999px; font-size:0.82rem;
            background:var(--bg-alt); color:var(--primary); border:1px solid var(--border);
        }
        .badge.secondary { color:var(--secondary); }
        .contact-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
        .qrcode-wrap { text-align:center; }
        .qrcode-img { max-width:160px; border-radius:10px; border:1px solid var(--border); }
        .qrcode-caption { font-size:0.85rem; color:var(--text-muted); margin-top:6px; }
        /* Highlights */
        section { padding:50px 0; border-bottom:1px solid var(--border); }
        section:last-of-type { border-bottom:none; }
        .section-title { font-size:1.6rem; margin-bottom:24px; display:flex; align-items:center; gap:10px; }
        .highlights-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:16px; }
        .highlight-card {
            background:var(--card); padding:20px; border-radius:12px; border:1px solid var(--border);
            box-shadow:var(--shadow); transition:var(--transition);
        }
        .highlight-card:hover { transform: translateY(-4px); box-shadow:var(--shadow-hover); }
        .highlight-card strong { color:var(--primary); font-size:1.1rem; display:block; margin-bottom:4px; }
        /* Tabs */
        .tab-wrap { margin-top:16px; }
        .tab-list { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; }
        .tab-btn {
            border:none; background:transparent; border-bottom:2px solid transparent;
            border-radius:0; padding:10px 16px; font-weight:600;
        }
        .tab-btn[aria-selected="true"] { border-bottom-color:var(--primary); color:var(--primary); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; animation: fadeIn 200ms ease; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
        /* Timeline */
        .timeline-item { margin-bottom:24px; position:relative; padding-left:22px; }
        .timeline-item::before {
            content:""; position:absolute; left:0; top:6px; width:8px; height:8px;
            border-radius:50%; background:var(--primary);
        }
        .timeline-header { display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:6px; }
        .timeline-title { font-weight:700; font-size:1.05rem; }
        .timeline-meta { color:var(--text-muted); font-size:0.9rem; }
        .timeline ul { padding-left:20px; margin-top:8px; }
        .timeline li { margin-bottom:8px; }
        /* Project Cards */
        .project-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap:20px; }
        .project-card {
            background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px;
            box-shadow:var(--shadow); transition:var(--transition);
        }
        .project-card:hover { transform: translateY(-4px); box-shadow:var(--shadow-hover); }
        .project-title { font-weight:700; font-size:1.15rem; margin-bottom:6px; }
        .project-meta { color:var(--text-muted); font-size:0.88rem; margin-bottom:10px; }
        .project-desc { margin-bottom:12px; font-size:0.95rem; }
        .project-img { width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:14px; border:1px solid var(--border); }
        /* Skill matrix */
        .skill-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:20px; }
        .skill-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
        .skill-card h4 { margin-bottom:12px; color:var(--primary); }
        .skill-item { margin-bottom:10px; }
        .skill-label { display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:4px; }
        .skill-bar { height:8px; background:var(--bg-alt); border-radius:999px; overflow:hidden; }
        .skill-fill { height:100%; background:linear-gradient(90deg, var(--primary), var(--secondary)); border-radius:999px; }
        /* Social image block */
        .social-block { margin-top:30px; padding:24px; background:var(--card); border-radius:12px; border:1px solid var(--border); }
        .social-img { max-width:220px; border-radius:10px; border:1px solid var(--border); }
        /* Education & Awards */
        .edu-item, .award-item { margin-bottom:16px; }
        .edu-header, .award-header { display:flex; justify-content:space-between; flex-wrap:wrap; }
        /* Back to top */
        .back-top {
            position:fixed; bottom:24px; right:24px; z-index:90;
            width:44px; height:44px; border-radius:50%;
            display:grid; place-items:center; box-shadow:var(--shadow);
            opacity:0; pointer-events:none; transition:var(--transition);
        }
        .back-top.visible { opacity:1; pointer-events:auto; }
        footer { padding:30px 0; color:var(--text-muted); font-size:0.88rem; text-align:center; }
        /* Print */
        @media print {
            body { padding-top:0; background:#fff; color:#111; }
            nav, .back-top, button:not(.print-keep) { display:none !important; }
            section { border-bottom:1px solid #ddd; page-break-inside:avoid; }
            .tab-panel { display:block !important; }
            .tab-list { display:none; }
            .highlight-card, .project-card, .skill-card { box-shadow:none; border:1px solid #ddd; }
            a { color:#111; text-decoration:none; }
            .qrcode-img, .project-img, .social-img { max-width:140px; }
        }
        /* Mobile */
        @media(max-width:768px) {
            .nav-links { display:none; }
            .hero h1 { font-size:1.8rem; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // Tabs helper
        function buildTabs(tabsData, listId, panelId){
            const listEl = document.getElementById(listId);
            const panelWrap = document.getElementById(panelId);
            tabsData.forEach((tab, idx)=>{
                const btn = document.createElement("button");
                btn.className = "tab-btn";
                btn.role = "tab";
                btn.ariaSelected = idx===0 ? "true":"false";
                btn.ariaControls = tab.id;
                btn.textContent = tab.label;
                btn.tabIndex = idx===0 ? 0:-1;
                btn.onclick = ()=>activateTab(tabsData, tab.id, listEl);
                btn.onkeydown = (e)=>{
                    if(e.key==="ArrowRight"){ const n=findNext(listEl.children, btn); n&&n.focus(); }
                    if(e.key==="ArrowLeft"){ const p=findPrev(listEl.children, btn); p&&p.focus(); }
                };
                listEl.appendChild(btn);

                const panel = document.createElement("div");
                panel.id = tab.id;
                panel.role = "tabpanel";
                panel.className = "tab-panel " + (idx===0 ? "active":"");
                let html = `<div class="timeline">`;
                tab.items.forEach(it=>{
                    html += `<div class="timeline-item">`;
                    // 如果项目有图片，放在最上方

                        <div class="timeline-header">

                        </div>

                    </div>`;
                });
                html += `</div>`;
                panel.innerHTML = html;
                panelWrap.appendChild(panel);
            });
        }
        function activateTab(allTabs, activeId, listEl){
            Array.from(listEl.children).forEach(b=>{
                const isActive = b.ariaControls === activeId;
                b.ariaSelected = isActive; b.tabIndex = isActive ? 0:-1;
            });
            document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
            document.getElementById(activeId).classList.add("active");
        }
        function findNext(nodes, curr){
            const arr = Array.from(nodes);
            const i = arr.indexOf(curr);
            return arr[(i+1)%arr.length];
        }
        function findPrev(nodes, curr){
            const arr = Array.from(nodes);
            const i = arr.indexOf(curr);
            return arr[(i-1+arr.length)%arr.length];
        }

                <div class="edu-header">
                    <span>${a.name}</span>
                    <span class="timeline-meta">${a.date}</span>
                </div>
            </div>`;
        });
        eduBlock.innerHTML = eduHtml;

        // Theme
        const themeBtn = document.getElementById("themeBtn");
        const savedTheme = localStorage.getItem("cv-theme");
        if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
        themeBtn.onclick = ()=>{
            const curr = document.documentElement.getAttribute("data-theme");
            const next = curr==="dark" ? "light":"dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("cv-theme", next);
        };

        // Print
        document.getElementById("printBtn").onclick = ()=> window.print();

        // Back to top
        const backTop = document.getElementById("backTop");
        window.addEventListener("scroll", ()=>{
            if(window.scrollY > 400) backTop.classList.add("visible");
            else backTop.classList.remove("visible");
        });

        // Footer year
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
